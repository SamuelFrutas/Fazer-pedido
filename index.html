<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Samuel Frutas</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #0b0f0d;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }
    main { max-width: 420px; }
    .logo { font-size: 42px; margin-bottom: 12px; }
    h1 { margin: 0 0 8px; font-size: 24px; }
    p { margin: 0; color: #aeb8b1; }
  </style>
</head>
<body>
  <main>
    <div class="logo">🍉</div>
    <h1>Samuel Frutas</h1>
    <p>Estamos direcionando você...</p>
  </main>
  <script>
    (() => {
      const agora = new Date();
      const partes = new Intl.DateTimeFormat('pt-BR', {
        timeZone: 'America/Sao_Paulo',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      }).formatToParts(agora);

      const hora = Number(partes.find(p => p.type === 'hour')?.value ?? 0);

      // 13:00–19:59 → Agendamentos
      // 20:00–12:59 → Pedidos
      const agendamentos = hora >= 13 && hora < 20;

      const destino = agendamentos
        ? 'https://samuelfrutas.github.io/Samuel-frutas-Agendamentos/preview/preview.html'
        : 'https://samuelfrutas.github.io/Samuel-frutas-pedido/loja/';

      window.location.replace(destino);
    })();
  </script>
</body>
</html>
