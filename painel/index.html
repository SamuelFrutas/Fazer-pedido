<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Controle • Fazer-pedido</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b0f0d;color:#fff;font-family:system-ui;padding:18px}.wrap{max-width:900px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}h1{margin:0;font-size:25px}.sub{color:#aeb8b1;margin:5px 0 0}.card{background:#111914;border:1px solid #26352b;border-radius:18px;padding:18px;margin-bottom:14px}.row{display:grid;grid-template-columns:1fr 130px 130px;gap:10px;align-items:end}.day{font-size:19px;font-weight:800;margin-bottom:12px}.field label{display:block;font-size:12px;color:#9eaaa2;margin-bottom:5px}.field input,.field select,button{width:100%;padding:12px;border-radius:11px;border:1px solid #33443a;background:#0b0f0d;color:#fff}.maintenance{display:flex;align-items:center;justify-content:space-between;gap:15px}.switch{width:58px;height:32px;position:relative}.switch input{display:none}.slider{position:absolute;inset:0;background:#38443d;border-radius:30px;cursor:pointer}.slider:before{content:'';position:absolute;width:24px;height:24px;left:4px;top:4px;background:#fff;border-radius:50%;transition:.2s}.switch input:checked+.slider{background:#d83b3b}.switch input:checked+.slider:before{transform:translateX(26px)}.btn{background:#35b96a;color:#07120b;font-weight:800;border:0;cursor:pointer}.logout{width:auto;background:#242d28;color:#fff}.status{color:#7de69e;min-height:22px;margin-top:10px}@media(max-width:650px){.row{grid-template-columns:1fr 1fr}.row .field:first-child{grid-column:1/-1}}</style></head><body><div class="wrap"><div class="top"><div><h1>⚙️ Controle do Fazer-pedido</h1><div class="sub">Horários por dia e modo manutenção</div></div><button id="sair" class="logout">Sair</button></div><div class="card maintenance"><div><strong>Modo manutenção</strong><div class="sub">Quando ligado, ninguém será redirecionado.</div></div><label class="switch"><input id="manutencao" type="checkbox"><span class="slider"></span></label></div><div id="dias"></div><div class="card"><button id="salvar" class="btn">Salvar configurações</button><div id="status" class="status"></div></div></div><script type="module" src="painel.js"></script></body></html>
