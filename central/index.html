<title>Samuel Frutas • Central</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080c0a;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:14px}.wrap{width:min(760px,100%);margin:auto}.head{text-align:center;margin:4px 0 14px}.logo{font-size:30px}.head h1{margin:2px 0;font-size:22px}.head p{margin:0;color:#8f9a93;font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:#111713;border:1px solid #26332b;border-radius:14px;padding:12px}.top{display:flex;align-items:center;gap:9px;margin-bottom:10px}.icon{font-size:22px}.card h2{margin:0;font-size:16px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:7px}.btn{display:flex;align-items:center;justify-content:center;min-height:38px;padding:8px;border-radius:9px;text-decoration:none;font-size:13px;font-weight:750;border:1px solid #344139;background:#1a221d;color:#fff}.btn.primary{background:#36b86b;border-color:#36b86b;color:#06110a}.btn.full{grid-column:1/-1}.btn.disabled{opacity:.4;pointer-events:none}.foot{text-align:center;color:#626c66;font-size:10px;margin-top:10px}@media(max-width:520px){.grid{grid-template-columns:1fr 1fr}.card{padding:10px}.buttons{grid-template-columns:1fr}.btn.full{grid-column:auto}.head{margin-bottom:10px}}
</style>
</head>

<div class="wrap">

<section class="card"><div class="top"><div class="icon">🤖</div><h2>Frutas Bot</h2></div><div class="buttons"><a class="btn primary full disabled" href="#">Painel</a></div></section>
<section class="card"><div class="top"><div class="icon">⏱️</div><h2>Fazer Pedido</h2></div><div class="buttons"><a class="btn primary full" href="https://samuelfrutas.github.io/Fazer-pedido/painel/login.html">Painel</a></div></section>
<section class="card"><div class="top"><div class="icon">🚚</div><h2>Samuel Entregas</h2></div><div class="buttons"><a class="btn primary full" href="https://samuelfrutas.github.io/sistema-entregas-samuel-frutas/dashboard/">Painel</a></div></section>
</main>
<div class="foot">Página estática • sem login • sem banco de dados</div>
</div>
