<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central Samuel Frutas</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#111;color:#fff;font-family:Arial,sans-serif;display:flex;justify-content:center;padding:18px}
    .wrap{width:100%;max-width:760px}
    h1{text-align:center;font-size:30px;margin:4px 0 8px}
    .sub{text-align:center;color:#aaa;font-size:15px;margin:0 0 20px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .card{background:#1b1b1b;border:1px solid #303030;border-radius:16px;padding:22px;min-height:125px;display:flex;flex-direction:column;justify-content:space-between}
    .name{font-size:19px;font-weight:700;margin-bottom:16px}
    .buttons{display:flex;gap:10px}
    a,button{flex:1;border:0;border-radius:10px;padding:13px 10px;text-align:center;text-decoration:none;font-size:15px;font-weight:700;cursor:pointer}
    a{background:#2b2b2b;color:#fff}
    a:hover{background:#383838}
    .disabled{background:#252525;color:#666;cursor:not-allowed}
    .footer{text-align:center;color:#666;font-size:12px;margin-top:18px}
    @media(max-width:430px){body{padding:12px}.wrap{max-width:100%}.grid{gap:12px}.card{padding:16px;min-height:125px}.name{font-size:17px;margin-bottom:14px}.buttons{gap:8px}a{font-size:13px;padding:12px 6px}}
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Central Samuel Frutas</h1>
    <p class="sub">Acesso rápido aos sistemas</p>

    <section class="grid">
      <div class="card">
        <div class="name">📅 Agendamentos</div>
        <div class="buttons">
          <a href="https://samuelfrutas.github.io/Samuel-frutas-Agendamentos/preview/preview.html">Site</a>
          <a href="https://samuelfrutas.github.io/Samuel-frutas-Agendamentos/preview/login.html">Painel</a>
        </div>
      </div>

      <div class="card">
        <div class="name">🛒 Pedidos</div>
        <div class="buttons">
          <a href="https://samuelfrutas.github.io/Samuel-frutas-pedido/loja/">Site</a>
          <a href="https://samuelfrutas.github.io/Samuel-frutas-pedido/login/">Painel</a>
        </div>
      </div>

      <div class="card">
        <div class="name">🤖 Samuel Frutas Bot</div>
        <div class="buttons">
          <a href="https://samuelfrutasbot-production.up.railway.app/admin">Painel</a>
        </div>
      </div>

      <div class="card">
        <div class="name">⚙️ Fazer Pedido</div>
        <div class="buttons">
          <a href="https://samuelfrutas.github.io/Fazer-pedido/painel/login.html">Painel</a>
        </div>
      </div>

      <div class="card">
        <div class="name">🚚 Samuel Entregas</div>
        <div class="buttons">
          <a href="https://samuelfrutas.github.io/sistema-entregas-samuel-frutas/">Painel</a>
        </div>
      </div>
    </section>

    <div class="footer">Página estática • sem login • sem banco de dados</div>
  </main>
</body>
</html>
