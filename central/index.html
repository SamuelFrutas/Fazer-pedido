<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central Samuel Frutas</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#0b0b0b;color:#fff;font-family:Arial,sans-serif;display:flex;justify-content:center;padding:18px}
    .wrap{width:100%;max-width:650px}
    h1{text-align:center;font-size:26px;margin:4px 0 6px}
    .sub{text-align:center;color:#aaa;font-size:13px;margin:0 0 18px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .card{background:linear-gradient(145deg,#252525,#171717);border:1px solid #444;border-radius:16px;padding:18px;box-shadow:0 7px 18px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.06);}
    .card:nth-child(1){border-color:#365b78}
    .card:nth-child(2){border-color:#69532d}
    .card:nth-child(3){border-color:#513d70}
    .card:nth-child(4){border-color:#35614d}
    .card:nth-child(5){border-color:#68413a}
    .name{font-size:17px;font-weight:700;margin-bottom:13px;text-shadow:0 1px 2px #000}
    .buttons{display:flex;gap:9px}
    a,button{flex:1;border:0;border-radius:10px;padding:12px 8px;text-align:center;text-decoration:none;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 3px 7px rgba(0,0,0,.35)}
    a{background:#333;color:#fff;border:1px solid #4a4a4a}
    a:hover{background:#444}
    .disabled{background:#252525;color:#666;cursor:not-allowed}
    .footer{text-align:center;color:#666;font-size:11px;margin-top:16px}
    @media(max-width:430px){body{padding:12px}.grid{gap:12px}.card{padding:15px;border-radius:15px}.name{font-size:15px;margin-bottom:11px}a{font-size:12px;padding:11px 6px}}
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Central Samuel Frutas</h1>
    <p class="sub">Acesso rápido aos sistemas</p>

    <section class="grid">
      <div class="card">
        <div class="name">📅 Agendamentos</div>
        <div class="buttons">
          <a href="https://samuelfrutas.github.io/Samuel-frutas-Agendamentos/preview/preview.html">Site</a>
          <a href="https://samuelfrutas.github.io/Samuel-frutas-Agendamentos/preview/login.html">Painel</a>
        </div>
      </div>

      <div class="card">
        <div class="name">🛒 Pedidos</div>
        <div class="buttons">
          <a href="https://samuelfrutas.github.io/Samuel-frutas-pedido/loja/">Site</a>
          <a href="https://samuelfrutas.github.io/Samuel-frutas-pedido/login/">Painel</a>
        </div>
      </div>

      <div class="card">
        <div class="name">🤖 Samuel Frutas Bot</div>
        <div class="buttons">
          <a href="https://samuelfrutasbot-production.up.railway.app/admin">Painel</a>
        </div>
      </div>

      <div class="card">
        <div class="name">⚙️ Fazer Pedido</div>
        <div class="buttons">
          <a href="https://samuelfrutas.github.io/Fazer-pedido/painel/login.html">Painel</a>
        </div>
      </div>

      <div class="card">
        <div class="name">🚚 Samuel Entregas</div>
        <div class="buttons">
          <a href="https://samuelfrutas.github.io/sistema-entregas-samuel-frutas/">Painel</a>
        </div>
      </div>
    </section>

    <div class="footer">Página estática • sem login • sem banco de dados</div>
  </main>
</body>
</html>
